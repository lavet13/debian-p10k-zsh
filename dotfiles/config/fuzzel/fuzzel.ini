# ~/.config/fuzzel/fuzzel.ini — Naysayer

[main]
terminal=wezterm start        # wraps Terminal=true apps (btop, htop, etc.) — foot takes the command positionally
font=Cascadia Mono:size=13    # matches your wezterm font
prompt="❯ "                   # prompt glyph (leave a trailing space after it if you want a gap)
lines=10                      # rows of matches to show (default 15)
width=35                      # window width in characters (default 30)
horizontal-pad=20             # px between border and content, left/right (default 40)
vertical-pad=12               # px between border and content, top/bottom (default 8)

[colors]
# All values are RRGGBBAA — the last two hex digits are alpha (ff = fully opaque).
background=062625ff           # bg    — window background
text=d0b892ff                 # fg    — unselected entry text
prompt=3ad0b5ff               # teal  — the prompt glyph
placeholder=126367ff          # muted — greyed hint text in the empty input
input=d0b892ff                # fg    — what you type
match=87ffdeff                # mint  — the matching substring, highlighted as you type
selection=0b3335ff            # hl    — background of the highlighted row
selection-text=d0b892ff       # fg    — text of the highlighted row
selection-match=87ffdeff      # mint  — matching substring on the highlighted row
counter=126367ff              # muted — match-count number (only if you enable match-counter)
border=3ad0b5ff               # teal  — window border

[border]
width=2                       # px; matches your sway `default_border pixel 2`
radius=0                      # sharp corners (default 10 = rounded)
