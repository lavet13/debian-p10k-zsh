monitor.bluez.properties = {
  # Only A2DP / LE-Audio roles — no hfp_*/hsp_* headset roles.
  # With headset roles gone, the device can't fall back to the mSBC
  # headset codec on reconnect; it stays A2DP (AAC). Trade-off: the
  # JBL's own mic is unavailable — fine here, input is the RØDE.
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source ]
}
