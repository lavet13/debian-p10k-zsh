# == Prefix ================================================
# Unbind default prefix Ctrl+b — it conflicts with vim's scroll up.
# Ctrl+a is easier to reach and doesn't conflict with nvim.
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix   # Ctrl+a Ctrl+a sends literal Ctrl+a to the shell

# == Terminal ===============================================
# Tell tmux to use 256 colors and enable true color support.
# Without this, colors in nvim look wrong inside tmux.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# == General ================================================
# Start window and pane numbering at 1 instead of 0.
# Much easier to reach on keyboard — 0 is far from 1-9.
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on  # renumber when a window is closed

# Remove the delay after pressing Escape.
# Default is 500ms which makes nvim feel sluggish inside tmux.
set -sg escape-time 0

# Increase scrollback buffer from default 2000 lines.
set -g history-limit 10000

# Enable mouse support — lets you click to select panes and scroll.
set -g mouse on

# == Keybindings ============================================
# Reload config without restarting tmux.
# Prefix + r sources this file and shows a confirmation message.
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and - instead of " and %.
# Much more intuitive — | for vertical split, - for horizontal.
# -c "#{pane_current_path}" opens the split in the same directory.
unbind '"'
unbind %
# Splits mirror sway's $mod+b / $mod+v  (b = side-by-side, v = stacked)
bind b split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# New window opens in current directory
bind c new-window -c "#{pane_current_path}"

# == Copy mode ==============================================
# Use vi keys in copy mode — consistent with nvim muscle memory.
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# == Status bar =============================================
set -g status-position bottom
set -g status-style "fg=#d0b892,bg=#0b3335"

set -g status-left "#[fg=#53d549,bg=#0b3335] #S "
set -g status-right "#[fg=#126367,bg=#0b3335]%H:%M "
set -g status-left-length 20

# Window tabs
set -g window-status-format "#[fg=#126367,bg=#0b3335] #I:#W "
set -g window-status-current-format "#[fg=#d0b892,bg=#062625] #I:#W#F "

# Pane borders
set -g pane-border-style "fg=#126367"
set -g pane-active-border-style "fg=#3ad0b5"

# Message bar (when you do prefix+r etc)
set -g message-style "fg=#d0b892,bg=#0b3335"

# Sessionizer: prefix + f opens an fzf project picker in a popup.
bind-key f display-popup -E "$HOME/.local/bin/tmux-sessionizer"

# To enable Yazi's image preview to work correctly in tmux session
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Refresh these from the attaching client's env on attach. -g global, -a APPEND
# (don't clobber tmux's default list, which already carries DISPLAY, SSH_*, etc.).
set -ga update-environment "SWAYSOCK"
set -ga update-environment "WAYLAND_DISPLAY"

# Bulletproof alternative — prefix then hjkl, -r lets you repeat without re-pressing prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
