services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-debian-p10k:latest
    container_name: debian-p10k
    stdin_open: true # keeps stdin open (needed for interactive shell)
    tty: true
    restart: unless-stopped

    environment:
      - TZ=Europe/Moscow

    # Mount the host Docker socket so our container can spawn sibling containers.
    # The container's docker CLI sends commands here → host's Docker Desktop daemon handles them.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspace:/home/devuser/workspace
      - ./.gemini:/home/devuser/.gemini  # persists GEMINI.md, commands
      - ~/.ssh:/home/devuser/.ssh:ro

    working_dir: /home/devuser/workspace
